name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, e.g. v0.1.0
        required: true
        type: string
      draft:
        description: Publish as draft release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  TAURI_UPDATER_ENDPOINT: https://github.com/ginuim/Sheaf/releases/latest/download/latest.json

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: Sheaf-macos-arm64
            expected_arch: arm64
            updater_platform: darwin-aarch64
          - target: x86_64-apple-darwin
            artifact: Sheaf-macos-x64
            expected_arch: x86_64
            updater_platform: darwin-x86_64

    runs-on: macos-latest

    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${expected_tag}" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          P12_PATH="certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | tr -d '[:space:]' | base64 --decode > "$P12_PATH"
          if [ ! -s "$P12_PATH" ]; then
            echo "APPLE_CERTIFICATE decoded to an empty file." >&2
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security import "$P12_PATH" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CERT_ID" ]; then
            echo "Developer ID Application certificate not found in keychain"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Setup App Store Connect API key
        env:
          APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_PRIVATE_KEY" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare updater config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const publicKey = process.env.TAURI_UPDATER_PUBLIC_KEY?.trim();
          const endpoint = process.env.TAURI_UPDATER_ENDPOINT;

          if (!publicKey) {
            throw new Error("Missing TAURI_UPDATER_PUBLIC_KEY repository secret.");
          }

          const updaterConfig = {
            bundle: {
              createUpdaterArtifacts: true,
              targets: ["app", "dmg"],
            },
            plugins: {
              updater: {
                endpoints: [endpoint],
                pubkey: publicKey,
              },
            },
          };

          fs.writeFileSync(
            "src-tauri/tauri.updater.conf.json",
            `${JSON.stringify(updaterConfig, null, 2)}\n`,
          );
          NODE

      - name: Build app bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          OUT_DIR="$GITHUB_WORKSPACE/release"
          mkdir -p "$OUT_DIR"

          DMG=$(find "$GITHUB_WORKSPACE/src-tauri/target" -path '*/release/bundle/dmg/*.dmg' -print -quit)
          if [ -z "$DMG" ]; then
            echo "DMG not found under src-tauri/target" >&2
            find "$GITHUB_WORKSPACE/src-tauri/target" -type f -name '*.dmg' 2>/dev/null || true
            exit 1
          fi

          UPDATER_BUNDLE=$(find "$GITHUB_WORKSPACE/src-tauri/target" -path '*/release/bundle/macos/*.app.tar.gz' -print -quit)
          if [ -z "$UPDATER_BUNDLE" ]; then
            echo "Updater bundle not found under src-tauri/target" >&2
            find "$GITHUB_WORKSPACE/src-tauri/target" -path '*/release/bundle/*' -type f 2>/dev/null | sort || true
            exit 1
          fi

          DMG_PATH="$OUT_DIR/${{ matrix.artifact }}.dmg"
          UPDATER_PATH="$OUT_DIR/${{ matrix.artifact }}.app.tar.gz"
          cp -f "$DMG" "$DMG_PATH"
          cp -f "$UPDATER_BUNDLE" "$UPDATER_PATH"
          cp -f "${UPDATER_BUNDLE}.sig" "${UPDATER_PATH}.sig"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "Collected DMG and updater bundle for ${{ matrix.artifact }}"

      - name: Create updater metadata
        env:
          RELEASE_DIR: release
          UPDATER_PLATFORM: ${{ matrix.updater_platform }}
          ARTIFACT_BASE: ${{ matrix.artifact }}
        run: node .github/scripts/release/create-updater-metadata.mjs

      - name: Notarize and staple DMG
        run: |
          echo "Notarizing DMG: $DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify signature and notarization
        run: |
          echo "Checking DMG: $DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          APP_PATH=$(find src-tauri/target -type d -name '*.app' -path '*/release/bundle/*' -print -quit)
          if [ -n "$APP_PATH" ]; then
            echo "Checking app bundle: $APP_PATH"
            APP_EXECUTABLE=$(find "$APP_PATH/Contents/MacOS" -type f -perm +111 -print -quit)
            if [ -z "$APP_EXECUTABLE" ]; then
              echo "No executable found in app bundle"
              exit 1
            fi
            ARCHS=$(lipo -archs "$APP_EXECUTABLE")
            echo "App executable architectures: $ARCHS"
            if [ "$ARCHS" != "${{ matrix.expected_arch }}" ]; then
              echo "Expected ${{ matrix.expected_arch }} app, got: $ARCHS"
              exit 1
            fi
            codesign -dv --verbose=2 "$APP_PATH"
            spctl -a -vv --type execute "$APP_PATH"
          else
            echo "No .app left on disk (dmg-only bundle); DMG stapler validation passed."
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-dmg
          path: release/${{ matrix.artifact }}.dmg
          if-no-files-found: error

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-updater
          path: |
            release/${{ matrix.artifact }}.app.tar.gz
            release/${{ matrix.artifact }}.app.tar.gz.sig
            release/release-metadata.json
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    env:
      TARGET: x86_64-pc-windows-msvc
      ARTIFACT: Sheaf-windows-x64
      UPDATER_PLATFORM: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${expected_tag}" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare updater config
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const publicKey = process.env.TAURI_UPDATER_PUBLIC_KEY?.trim();
          const endpoint = process.env.TAURI_UPDATER_ENDPOINT;

          if (!publicKey) {
            throw new Error("Missing TAURI_UPDATER_PUBLIC_KEY repository secret.");
          }

          const updaterConfig = {
            bundle: {
              createUpdaterArtifacts: true,
              targets: ["nsis"],
            },
            plugins: {
              updater: {
                endpoints: [endpoint],
                pubkey: publicKey,
                windows: {
                  installMode: "passive",
                },
              },
            },
          };

          fs.writeFileSync(
            "src-tauri/tauri.updater.conf.json",
            `${JSON.stringify(updaterConfig, null, 2)}\n`,
          );
          NODE

      - name: Build app bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ env.TARGET }} --config src-tauri/tauri.updater.conf.json

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$GITHUB_WORKSPACE/release"
          mkdir -p "$OUT_DIR"

          SETUP=$(find "$GITHUB_WORKSPACE/src-tauri/target" -path '*/release/bundle/nsis/*-setup.exe' -print -quit)
          if [ -z "$SETUP" ]; then
            echo "NSIS setup not found under src-tauri/target" >&2
            find "$GITHUB_WORKSPACE/src-tauri/target" -path '*/release/bundle/*' -type f 2>/dev/null | sort || true
            exit 1
          fi

          if [ ! -f "${SETUP}.sig" ]; then
            echo "Updater signature not found for ${SETUP}" >&2
            exit 1
          fi

          SETUP_PATH="$OUT_DIR/${ARTIFACT}-setup.exe"
          cp -f "$SETUP" "$SETUP_PATH"
          cp -f "${SETUP}.sig" "${SETUP_PATH}.sig"
          echo "Collected NSIS installer for ${ARTIFACT}"

      - name: Create updater metadata
        shell: bash
        env:
          RELEASE_DIR: release
          UPDATER_PLATFORM: ${{ env.UPDATER_PLATFORM }}
          ARTIFACT_BASE: ${{ env.ARTIFACT }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: node .github/scripts/release/create-updater-metadata.mjs

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}-installer
          path: release/${{ env.ARTIFACT }}-setup.exe
          if-no-files-found: error

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}-updater
          path: |
            release/${{ env.ARTIFACT }}-setup.exe
            release/${{ env.ARTIFACT }}-setup.exe.sig
            release/release-metadata.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}

      - name: Write release notes
        run: |
          version="${RELEASE_TAG#v}"
          cat > release-notes.md <<EOF
          ## Sheaf ${version}

          ### 下载安装
          请下载对应平台的安装包（其余文件供应用内自动更新使用，无需手动下载）：
          - **Apple Silicon：** [Sheaf-macos-arm64.dmg](https://github.com/ginuim/Sheaf/releases/download/${RELEASE_TAG}/Sheaf-macos-arm64.dmg)
          - **Intel Mac：** [Sheaf-macos-x64.dmg](https://github.com/ginuim/Sheaf/releases/download/${RELEASE_TAG}/Sheaf-macos-x64.dmg)
          - **Windows (x64)：** [Sheaf-windows-x64-setup.exe](https://github.com/ginuim/Sheaf/releases/download/${RELEASE_TAG}/Sheaf-windows-x64-setup.exe)

          官网下载：[sheaf.reaidea.com](https://sheaf.reaidea.com)
          EOF

      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Sheaf-macos-*-dmg
          path: release-dmg
          merge-multiple: true

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: Sheaf-windows-x64-installer
          path: release-windows

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Sheaf-*-updater
          path: release-updater
          merge-multiple: true

      - name: Generate updater manifest
        env:
          RELEASE_ASSETS_ROOT: release-updater
          RELEASE_NOTES_PATH: release-notes.md
          OUTPUT_PATH: release/latest.json
        run: node .github/scripts/release/generate-updater-manifest.mjs

      - name: List release files
        run: find release-dmg release-windows release-updater release -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sheaf ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            release-dmg/Sheaf-macos-arm64.dmg
            release-dmg/Sheaf-macos-x64.dmg
            release-windows/Sheaf-windows-x64-setup.exe
            release-updater/Sheaf-macos-arm64-updater/Sheaf-macos-arm64.app.tar.gz
            release-updater/Sheaf-macos-x64-updater/Sheaf-macos-x64.app.tar.gz
            release/latest.json
          fail_on_unmatched_files: true
