<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        function readCookie(name) {
          var cookie = "; " + document.cookie;
          var parts = cookie.split("; " + name + "=");
          if (parts.length !== 2) return null;
          return decodeURIComponent(parts.pop().split(";").shift());
        }
        var lang = readCookie("reaidea_lang");
        if (!lang) {
          var n = (navigator.language || "").toLowerCase();
          lang = n.indexOf("zh") === 0 ? "zh" : "en";
        }
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sheaf — 为专注写作而生的 Markdown 编辑器。分屏预览、AI 改写、本地文件与 PDF 导出。"
    />
    <title>Sheaf — 专注写作的 Markdown 编辑器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/website/main.ts"></script>
  </body>
</html>
